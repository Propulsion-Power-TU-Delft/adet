[project]
name = "ADeT"
version = "0.0.1"
description = "Autodiff DEsigner for Turbomachinery"
readme = "README.md"
authors = [
    { name = "Francesco Vaccari", email = "f.vaccari@tudelft.nl" }
]
requires-python = ">=3.12"
dependencies = [
    "ambiance>=1.3.1",
    "art>=6.5",
    "bezier>=2024.6.20",
    "casadi>=3.7.2",
    "coolprop>=7.1.0",
    "jax>=0.9.2",
    "matplotlib>=3.10.7",
    "pint>=0.25",
    "sympy>=1.14.0",
]

[project.scripts]
adet = "adet:main"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.32.1",
    "ipdb>=0.13.13",
    "ipython<=9.6.0",
    "mypy>=1.20.2",
    "pdbpp>=0.11.7",
    "pytest>=8.4.2",
    "ruff>=0.14.3",
    "ty>=0.0.30",
]
docs = [
    "myst-parser>=4.0.1",
    "pydata-sphinx-theme>=0.16.1",
    "sphinx>=8.2.3",
    "sphinx-inline-tabs>=2023.4.21",
]

[tool.pyright]
typeCheckingMode = "basic"
exclude = ["\\Interactive**", "**\\.venv"]

[tool.ty.rules]
invalid-method-override = "ignore"

[tool.ty.analysis]
allowed-unresolved-imports = ["some_untyped_lib.**"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Enable pycodestyle errors and warnings (E, W) and pyflakes (F)
select = ["E", "W", "F", "ARG", "C4", "B"]
ignore = ["B006", "B905"]

[tool.ruff.lint.per-file-ignores]
# Ignore `E402` (import violations) in selected files and directories
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]
"main.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
